name: GitHub Streak Stats

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch streak stats
        run: |
          curl -fL --retry 3 --retry-delay 5 "https://streak-stats.demolab.com?user=snehassneha4578-collab&theme=dark&hide_border=true&date_format=j%20M%5B%20Y%5D&ring=00d4ff&fire=ff6b35&currStreakLabel=00d4ff&sideLabels=00d4ff&background=0a0e27" -o github-streak-stats.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-streak-stats.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub streak stats"
          git push
