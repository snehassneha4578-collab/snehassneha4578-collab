name: GitHub Streak Stats

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch streak stats
        id: fetch
        shell: bash
        run: |
          set -e
          url="https://streak-stats.demolab.com?user=snehassneha4578-collab&theme=dark&hide_border=true&date_format=j%20M%5B%20Y%5D&ring=00d4ff&fire=ff6b35&currStreakLabel=00d4ff&sideLabels=00d4ff&background=0a0e27"
          tmp_file="$(mktemp)"
          trap 'rm -f "$tmp_file"' EXIT

          if curl --fail --location \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --connect-timeout 15 --max-time 90 \
            "$url" --output "$tmp_file" &&
            grep -qi '<svg' "$tmp_file"; then
            mv "$tmp_file" github-streak-stats.svg
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Streak SVG updated successfully."
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Streak stats service unavailable or returned invalid SVG. Keeping the previous file."
          fi

      - name: Commit and push
        if: steps.fetch.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-streak-stats.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub streak stats"
          git push
